name: Sovereign Codex manual worker (candidate)

# Protected pilot: no event-, issue-, PR-, schedule-, or label-triggered API calls.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Explicitly authorized pilot issue number (currently 76 only)'
        type: string
        required: true
      approval_confirmation:
        description: 'Type APPROVE-76-ONE-PAID-RUN after checking active owner grant and Platform budget/hard-limit settings'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: sovereign-manual-codex-paid-worker
  cancel-in-progress: false

jobs:
  propose:
    if: ${{ github.repository == 'MightyMulligan-ops/strategy-game' && github.ref == 'refs/heads/main' && github.actor == 'MightyMulligan-ops' && inputs.issue_number == '76' && inputs.approval_confirmation == 'APPROVE-76-ONE-PAID-RUN' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      AUTH_ENABLED: 'false'
      RUN_DATABASE_TESTS: '0'
    steps:
      - name: Check out reviewed main with no persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up trusted toolchain
        uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
        with:
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Prepare workspace before API key is exposed
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          mkdir -p .cache/codex-worker
          printf '%s\n' "issue=76" "base_sha=${GITHUB_SHA}" "run=${GITHUB_RUN_ID}" > .cache/codex-worker/identity.txt

      # The action's API-key proxy is isolated from the read-only checkout token.
      # No repository write token, issue body, external PR text, or existing DB credentials
      # are supplied to the agent. No automatic retries or additional agents.
      - name: Implement a bounded local proposal (one paid invocation)
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'
          output-file: .cache/codex-worker/final.md
          prompt: |
            Implement only Sovereign Issue #76, Combat 1A, from trusted main.
            Read AGENTS.md, docs/GAME_DESIGN.md, docs/DEVELOPMENT_ROADMAP.md,
            and the committed issue-scope handoff in docs/CODEX_WORKER_PILOT.md.
            This run may modify the checkout only; it may NOT commit, push,
            create a branch or PR, alter workflows, retrieve secrets, use an
            existing database, execute migrations, or access deployment.
            No external network access is required for gameplay implementation.
            Implement only the pure two-formation deterministic combat module
            and its database-free tests; report open design ambiguities rather
            than inventing multiplayer/air/naval mechanics.
            Run build, typecheck, lint and unit tests with
            AUTH_ENABLED=false RUN_DATABASE_TESTS=0. Never invoke Docker,
            PostgreSQL, db:migrate, or production endpoints.
            Do not amend README, AGENTS.md, CI, workflows, dependencies,
            schemas/migrations or security/authorization systems.
            Finish with tests run/results, remaining limitations and a compact
            plain-text handoff. No secrets or raw logs in the final message.

      # The following steps have no API key and no elevated GitHub token.
      - name: Validate and capture bounded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess
          allowed_prefixes = ('packages/', 'apps/')
          allowed_docs = {'docs/DEVELOPMENT_STATUS.md', 'docs/GAME_DESIGN.md'}
          paths = subprocess.check_output(
              ['git','status','--porcelain','--untracked-files=all'], text=True
          ).splitlines()
          changed = []
          for item in paths:
              name = item[3:]
              if ' -> ' in name or not (name.startswith(allowed_prefixes) or name in allowed_docs):
                  raise SystemExit('Disallowed or renamed checkout change; no patch artifact published')
              if name.startswith('apps/') and not ('/src/' in name or '/test' in name):
                  raise SystemExit('Unexpected application path')
              if name.endswith(('.env', '.pem', '.key')) or '/.env' in name:
                  raise SystemExit('Secret-like file path rejected')
              changed.append(name)
          if not changed:
              raise SystemExit('No source changes produced; do not publish empty patch')
          subprocess.run(['git','add','-N','--',*changed], check=True)
          patch = subprocess.check_output(['git','diff','--binary','--',*changed])
          if len(patch)>1_500_000 or len(changed)>25:
              raise SystemExit('Change budget exceeded')
          out=pathlib.Path('.cache/codex-worker')
          out.mkdir(parents=True,exist_ok=True)
          (out/'proposal.patch').write_bytes(patch)
          (out/'changed-paths.txt').write_text('\n'.join(changed)+'\n')
          PY
      - name: Upload untrusted proposal for human inspection
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sovereign-issue-76-codex-proposal
          path: |
            .cache/codex-worker/identity.txt
            .cache/codex-worker/changed-paths.txt
            .cache/codex-worker/proposal.patch
            .cache/codex-worker/final.md
          if-no-files-found: error
          retention-days: 1
