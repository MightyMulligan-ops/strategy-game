services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: strategy_game_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: strategy_game_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - strategy-game-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strategy_game_local -d strategy_game_dev"]
      interval: 5s
      timeout: 3s
      retries: 12
  db-test:
    image: postgres:17
    profiles: ["test"]
    environment:
      POSTGRES_USER: strategy_game_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: strategy_game_test
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - strategy-game-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strategy_game_local -d strategy_game_test"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  strategy-game-dev:
  strategy-game-test:
